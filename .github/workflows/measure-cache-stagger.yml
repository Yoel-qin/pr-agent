name: Measure cache stagger (one-shot)

# Measurement-only workflow for #4877 on a side branch; never merged to main.
on:
  push:
    branches: ["measure/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pipx install uv==0.13.8

      - name: Point the handler at the Anthropic-format endpoint
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          printf '[anthropic]\nkey = "%s"\n' "$DEEPSEEK_API_KEY" > pr_agent/settings/.secrets.toml

      - name: Install dependencies
        run: uv sync --frozen --python 3.12

      - name: Run the before/after measurement
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_BASE: https://api.deepseek.com/anthropic
          MEASURE_FORCE_STAGGER: "1"
        run: uv run python measure_cache_stagger.py
